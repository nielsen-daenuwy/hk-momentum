name: Scan and publish

on:
  schedule:
    - cron: "30 9 * * 1-5"      # 09:30 UTC = 17:30 Hong Kong time, Monday to Friday
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      # Up to 3 attempts, 5 minutes apart. If all fail the site keeps the last good scan.
      - name: Scan
        id: scan
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if python -m scanner.run; then exit 0; fi
            if [ "$i" -lt 3 ]; then echo "Attempt $i failed, waiting 5 minutes"; sleep 300; fi
          done
          exit 1

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data cache
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -m "Scan $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Report a failed scan
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::The scan failed. The site is still showing the previous results."
          exit 1
